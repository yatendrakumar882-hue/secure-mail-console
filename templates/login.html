
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Secure Mail Console - Login</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>
<body class="login-page">
  <main class="login-card">
    <div class="login-logo"><i class="fa-solid fa-shield-halved"></i></div>
    <h1>Secure Mail Console</h1>
    <p class="login-subtitle">Sign in to continue</p>

    <form method="post" autocomplete="off">
      <label for="password">Password</label>
      <div class="login-password">
        <input id="password" name="password" type="password"
               placeholder="Enter password" autocomplete="current-password" required autofocus>
        <button type="button" id="showPassword" aria-label="Show or hide password">
          <i class="fa-regular fa-eye"></i>
        </button>
      </div>

      {% if error %}
      <div class="login-error" role="alert">
        <i class="fa-solid fa-circle-exclamation"></i> {{ error }}
      </div>
      {% endif %}

      <button type="submit" class="login-button">
        <i class="fa-solid fa-right-to-bracket"></i> Login
      </button>
    </form>

    <div class="login-footer">
      <i class="fa-solid fa-shield-halved"></i> Secure Mail Console
    </div>
  </main>

  <script>
    const passwordInput = document.getElementById("password");
    document.getElementById("showPassword").addEventListener("click", function () {
      passwordInput.type = passwordInput.type === "password" ? "text" : "password";
      this.innerHTML = passwordInput.type === "password"
        ? '<i class="fa-regular fa-eye"></i>'
        : '<i class="fa-regular fa-eye-slash"></i>';
    });
  </script>
</body>
</html>
