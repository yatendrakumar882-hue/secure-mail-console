<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Login | Secure Mail Console</title><link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"></head>
<body class="login-page"><main class="login-card">
<div class="eyebrow">PRIVATE ACCESS</div><h1>Secure Mail Console</h1><p class="muted">Enter your password to continue.</p>
{% if error %}<p class="error">{{ error }}</p>{% endif %}
<form method="post" action="{{ url_for('login') }}"><label>Login password<input type="password" name="password" required autofocus autocomplete="current-password"></label><button class="btn primary full" type="submit">Log in</button></form>
</main></body></html>
