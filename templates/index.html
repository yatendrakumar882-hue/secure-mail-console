
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bulk Email Sender</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f4f6fa;color:#202938;font-family:Arial,sans-serif}
header{background:#fff;padding:18px 5%;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #e1e6ee}
header strong{font-size:21px}
a{color:#1769d2;text-decoration:none}
main{max-width:1250px;margin:26px auto;padding:0 18px;display:grid;grid-template-columns:1.1fr .9fr;gap:22px}
.card{background:#fff;border:1px solid #e0e5ed;border-radius:12px;padding:22px;margin-bottom:20px}
h2{font-size:19px;margin:0 0 18px}
label{display:block;font-size:13px;font-weight:600;margin-bottom:7px}
.field{margin-bottom:16px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
input:not([type=checkbox]),textarea{width:100%;padding:12px;border:1px solid #ccd4df;border-radius:7px;font:14px Arial}
textarea{min-height:130px;resize:vertical;line-height:1.5}
small,.muted{font-size:12px;color:#687386;line-height:1.5}
.modebar{display:flex;gap:8px;margin-bottom:10px}
button{font-family:Arial;cursor:pointer}
.mode{border:1px solid #d3dbe6;background:#fff;padding:8px 12px;border-radius:7px}
.mode.active{background:#eaf2ff;border-color:#8bb7ff;color:#1458b4}
.consent{display:flex;gap:9px;align-items:flex-start;margin-top:18px}
.consent label{font-weight:400;line-height:1.5}
.recipient-area{min-height:180px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}
.stat{background:#f7f9fc;padding:12px 8px;border-radius:8px}
.stat span{display:block;color:#6b7483;font-size:10px;margin-bottom:8px}
.stat strong{font-size:22px}
.green{color:#16834b}.red{color:#cf3434}.orange{color:#c77c12}
.track{height:8px;background:#e9edf3;border-radius:20px;overflow:hidden;margin:20px 0 12px}
#progress{height:100%;width:0;background:#3478e5;transition:width .2s}
.actions{display:flex;gap:10px;margin-top:16px}
.primary,.danger{border:0;padding:12px 18px;border-radius:7px;font-weight:600}
.primary{background:#216bd6;color:white;flex:1}
.danger{background:#fff0f0;color:#b42318;border:1px solid #f0c5c5}
button:disabled{opacity:.55;cursor:not-allowed}
#status{font-size:13px;color:#566174;line-height:1.5}
.results{margin-top:15px;max-height:280px;overflow:auto}
.result{font-size:12px;line-height:1.5;padding:9px;border-bottom:1px solid #edf0f4;overflow-wrap:anywhere}
.result.sent{color:#167344}.result.failed{color:#b42318}
@media(max-width:800px){main{grid-template-columns:1fr}.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<header>
  <strong>✉ Bulk Email Sender</strong>
  <a href="/logout">Logout</a>
</header>

<main>
<section>
  <div class="card">
    <h2>Compose Email</h2>

    <div class="grid">
      <div class="field">
        <label for="senderName">Sender name</label>
        <input id="senderName" maxlength="100" placeholder="Your name">
      </div>
      <div class="field">
        <label for="senderEmail">Gmail address</label>
        <input id="senderEmail" type="email" placeholder="you@gmail.com">
      </div>
    </div>

    <div class="field">
      <label for="appPassword">Google App Password</label>
      <input id="appPassword" type="password" placeholder="Google App Password">
      <small>Use your Google App Password, not your normal Gmail password.</small>
    </div>

    <div class="field">
      <label for="subject">Email subject</label>
      <input id="subject" maxlength="200" placeholder="Clear and relevant subject">
    </div>

    <div class="field">
      <label for="body">Message body</label>
      <div class="modebar">
        <button type="button" class="mode active" data-mode="plain">Plain text</button>
        <button type="button" class="mode" data-mode="html">HTML</button>
      </div>
      <textarea id="body" placeholder="Write your email message..."></textarea>
      <small>Keep the message relevant to recipients and use accurate information.</small>
    </div>

    <div class="consent">
      <input type="checkbox" id="consent">
      <label for="consent">I confirm that these recipients agreed to receive these emails.</label>
    </div>
  </div>
</section>

<section>
  <div class="card">
    <h2>Recipients</h2>
    <label for="recipients">Email addresses</label>
    <textarea id="recipients" class="recipient-area"
      placeholder="person@example.com&#10;another@example.com"></textarea>
    <p class="muted"><span id="count">0</span> unique addresses · maximum 25 per request</p>
  </div>

  <div class="card">
    <h2>Progress Monitor</h2>
    <div class="stats">
      <div class="stat"><span>TOTAL</span><strong id="total">0</strong></div>
      <div class="stat"><span>SENT</span><strong id="sent" class="green">0</strong></div>
      <div class="stat"><span>FAILED</span><strong id="failed" class="red">0</strong></div>
      <div class="stat"><span>REMAINING</span><strong id="remaining" class="orange">0</strong></div>
    </div>
    <div class="track"><div id="progress"></div></div>
    <p id="status" role="status">Ready to send.</p>
    <div class="actions">
      <button class="primary" id="send" type="button">Send emails</button>
      <button class="danger" id="stop" type="button" disabled>Stop</button>
    </div>
    <div id="results" class="results"></div>
  </div>
</section>
</main>

<script>
(() => {
  const $ = id => document.getElementById(id);
  let mode = "plain";
  let running = false;
  let stopRequested = false;

  function getRecipients() {
    return [...new Set(
      $("recipients").value.split(/[\s,;]+/)
        .map(value => value.trim().toLowerCase())
        .filter(Boolean)
    )];
  }

  $("recipients").addEventListener("input", () => {
    $("count").textContent = getRecipients().length;
  });

  document.querySelectorAll(".mode").forEach(button => {
    button.addEventListener("click", () => {
      mode = button.dataset.mode;
      document.querySelectorAll(".mode").forEach(item =>
        item.classList.toggle("active", item === button)
      );
    });
  });

  $("stop").addEventListener("click", () => {
    stopRequested = true;
    $("status").textContent =
      "Stop requested. The current batch may finish first.";
    $("stop").disabled = true;
  });

  function addResult(item) {
    const row = document.createElement("div");
    row.className = "result " + item.status;
    row.textContent =
      `${item.status.toUpperCase()} — ${item.email}: ${item.detail || ""}`;
    $("results").append(row);
  }

  $("send").addEventListener("click", async () => {
    if (running) return;

    const recipients = getRecipients();
    const senderEmail = $("senderEmail").value.trim();
    const appPassword = $("appPassword").value.trim();
    const senderName = $("senderName").value.trim();
    const subject = $("subject").value.trim();
    const body = $("body").value.trim();

    if (!senderEmail || !appPassword || !subject || !body || !recipients.length) {
      $("status").textContent = "Complete all required fields first.";
      return;
    }
    if (recipients.length > 25) {
      $("status").textContent = "Maximum 25 recipients per request.";
      return;
    }
    if (!$("consent").checked) {
      $("status").textContent = "Confirm recipient permission first.";
      return;
    }

    running = true;
    stopRequested = false;
    $("send").disabled = true;
    $("stop").disabled = false;
    $("results").replaceChildren();

    let sent = 0, failed = 0, processed = 0;
    $("total").textContent = recipients.length;
    $("sent").textContent = "0";
    $("failed").textContent = "0";
    $("remaining").textContent = recipients.length;
    $("progress").style.width = "0%";
    $("status").textContent = "Sending...";

    try {
      for (let start = 0; start < recipients.length; start += 8) {
        if (stopRequested) break;

        const response = await fetch("/send-batch", {
          method: "POST",
          headers: {"Content-Type": "application/json"},
          body: JSON.stringify({
            recipients: recipients.slice(start, start + 8),
            senderEmail, appPassword, senderName, subject, body,
            htmlMode: mode === "html",
            consentConfirmed: $("consent").checked
          })
        });

        const data = await response.json();
        if (!response.ok) {
          throw new Error(data.error || "Sending request failed.");
        }

        for (const item of data.results || []) {
          addResult(item);
          if (item.status === "sent") sent++;
          else failed++;
          processed++;
        }

        $("sent").textContent = sent;
        $("failed").textContent = failed;
        $("remaining").textContent = recipients.length - processed;
        $("progress").style.width =
          Math.round(processed / recipients.length * 100) + "%";
        $("status").textContent =
          `Processed ${processed} of ${recipients.length}.`;
      }

      $("status").textContent = stopRequested
        ? `Stopped. SMTP accepted: ${sent}; failed: ${failed}.`
        : `Finished. SMTP accepted: ${sent}; failed: ${failed}.`;
    } catch (error) {
      $("status").textContent = "Error: " + error.message;
    } finally {
      running = false;
      $("send").disabled = false;
      $("stop").disabled = true;
    }
  });
})();
</script>
</body>
</html>
