<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Mail Console</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Outfit', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background: #f0f4f9; color: #1e293b; padding: 24px 20px; min-height: 100vh; }
        .main-wrapper { max-width: 1100px; margin: 0 auto; }
        
        /* Top Header */
        .top-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 24px; }
        .brand-title { display: flex; align-items: center; gap: 10px; font-size: 22px; font-weight: 800; color: #0f172a; }
        .header-actions { display: flex; align-items: center; gap: 10px; }
        .badge-safe { font-size: 11px; background: #e0f2fe; color: #0369a1; padding: 5px 12px; border-radius: 9999px; font-weight: 700; }
        .btn-logout { background: #fee2e2; color: #dc2626; border: 1px solid #fecaca; padding: 6px 14px; border-radius: 8px; font-size: 12px; font-weight: 700; cursor: pointer; transition: 0.2s; user-select: none; display: flex; align-items: center; gap: 6px; }
        .btn-logout:hover { background: #fca5a5; }

        /* 2-Card Layout */
        .app-layout { display: grid; grid-template-columns: 1.15fr 1fr; gap: 24px; align-items: start; }
        .card { background: #ffffff; border-radius: 16px; padding: 24px; box-shadow: 0 4px 20px -2px rgba(0,0,0,0.04); border: 1px solid #e9eff6; }
        .card-title { display: flex; align-items: center; justify-content: space-between; font-size: 15px; font-weight: 700; color: #0f172a; margin-bottom: 18px; }
        .card-title span { display: flex; align-items: center; gap: 8px; }
        
        .count-badge { font-size: 11px; background: #eff6ff; color: #3b82f6; padding: 3px 10px; border-radius: 9999px; font-weight: 600; }

        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-bottom: 14px; }
        .form-group { display: flex; flex-direction: column; gap: 6px; }
        label { font-size: 12px; font-weight: 600; color: #475569; }
        
        .input-wrapper { position: relative; width: 100%; }
        input, textarea { background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 8px; padding: 10px 14px; color: #0f172a; font-size: 13px; outline: none; width: 100%; transition: all 0.2s; }
        input:focus, textarea:focus { border-color: #3b82f6; background: #ffffff; box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1); }
        textarea { resize: vertical; }

        .toggle-eye { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); color: #94a3b8; cursor: pointer; font-size: 13px; }

        /* Progress Monitor Grid */
        .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 16px; }
        .stat-box { background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 12px; padding: 14px; text-align: center; }
        .stat-label { font-size: 11px; font-weight: 700; letter-spacing: 0.5px; color: #64748b; margin-bottom: 4px; }
        .stat-value { font-size: 24px; font-weight: 800; }
        .stat-total { color: #3b82f6; }
        .stat-sent { color: #10b981; }
        .stat-failed { color: #ef4444; }
        .stat-remaining { color: #f59e0b; }

        /* Progress Bar Track */
        .progress-track { width: 100%; height: 8px; background: #e2e8f0; border-radius: 9999px; overflow: hidden; margin-bottom: 14px; }
        .progress-bar { width: 0%; height: 100%; background: linear-gradient(90deg, #3b82f6, #10b981); transition: width 0.3s ease; }

        .status-text { font-size: 12px; font-weight: 600; color: #64748b; display: flex; align-items: center; justify-content: center; gap: 6px; margin-bottom: 14px; }

        .control-btns { display: flex; gap: 10px; }
        .btn-action { flex: 1; border: none; padding: 12px; border-radius: 8px; font-size: 14px; font-weight: 700; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; transition: 0.2s; }
        .btn-send { background: #10b981; color: white; }
        .btn-send:hover:not(:disabled) { background: #059669; }
        .btn-send:disabled { background: #cbd5e1; color: #64748b; cursor: not-allowed; }
        .btn-stop { background: #ef4444; color: white; display: none; }
        .btn-stop:hover { background: #dc2626; }

        /* Turnstile Wrapper */
        .turnstile-box { margin-top: 10px; }

        /* Password Gate Overlay */
        .lock-overlay { position: fixed; inset: 0; background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(4px); display: flex; align-items: center; justify-content: center; z-index: 1000; }
        .lock-card { background: #ffffff; border-radius: 12px; padding: 28px; width: 100%; max-width: 360px; text-align: center; }
        .hidden { display: none !important; }
        .btn-shake { animation: shake 0.3s ease-in-out; }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-4px); }
            75% { transform: translateX(4px); }
        }
    </style>
</head>

<body>

<div class="lock-overlay" id="passwordGate">
    <div class="lock-card">
        <h2 style="font-size: 18px; margin-bottom: 6px;"><i class="fa-solid fa-lock"></i> Access Protected</h2>
        <p style="font-size: 13px; color: #64748b; margin-bottom: 16px;">Enter administrative access password</p>
        <form id="gateForm" autocomplete="off">
            <input type="password" id="gatePass" placeholder="Enter password..." required style="margin-bottom: 12px;" />
            <div id="gateError" class="hidden" style="color: #ef4444; font-size: 12px; margin-bottom: 10px; font-weight: 600;">Incorrect Password</div>
            <button type="submit" id="gateSubmitBtn" class="btn-action btn-send" style="background: #3b82f6; width: 100%;">
                <i class="fa-solid fa-arrow-right-to-bracket"></i> Enter
            </button>
        </form>
    </div>
</div>

<div class="main-wrapper hidden" id="mainApp">
    <!-- Top Header -->
    <div class="top-header">
        <div class="brand-title">
            <i class="fa-solid fa-paper-plane"></i> Bulk Email Sender
        </div>
        <div class="header-actions">
            <span class="badge-safe"><i class="fa-solid fa-shield-halved"></i> 6-Batch Safe Engine</span>
            <button type="button" class="btn-logout" id="logoutBtn" title="Double click to logout">
                <i class="fa-solid fa-right-from-bracket"></i> Logout (Double Click)
            </button>
        </div>
    </div>

    <div class="app-layout">
        <!-- LEFT CARD: Compose Message -->
        <div class="card">
            <div class="card-title">
                <span><i class="fa-regular fa-pen-to-square"></i> Compose Message</span>
            </div>

            <div class="form-grid">
                <div class="form-group">
                    <label>Sender Name</label>
                    <input type="text" id="senderName" placeholder="E.g., John Doe" required />
                </div>
                <div class="form-group">
                    <label>Your Gmail</label>
                    <input type="email" id="email" placeholder="you@gmail.com" required />
                </div>
            </div>

            <div class="form-grid">
                <div class="form-group">
                    <label>App Password</label>
                    <div class="input-wrapper">
                        <input type="password" id="appPassword" placeholder="16-char app password" required />
                        <i class="fa-regular fa-eye toggle-eye" id="togglePassword"></i>
                    </div>
                </div>
                <div class="form-group">
                    <label>Email Subject</label>
                    <input type="text" id="subject" placeholder="Enter subject line..." required />
                </div>
            </div>

            <div class="form-group" style="margin-bottom: 14px;">
                <label>Message Body (Plain Text / HTML)</label>
                <textarea id="messageBody" style="min-height: 220px;" placeholder="Write your email here... Spintax supported: {Hi|Hello}" required></textarea>
            </div>

            <div class="turnstile-box">
                <label style="margin-bottom: 6px; display: block;">Spam Protection</label>
                <div class="cf-turnstile" data-sitekey="1x00000000000000000000AA" data-theme="light"></div>
            </div>
        </div>

        <!-- RIGHT COLUMN -->
        <div style="display: flex; flex-direction: column; gap: 24px;">
            <!-- TOP RIGHT: Recipients -->
            <div class="card">
                <div class="card-title">
                    <span><i class="fa-solid fa-users"></i> Recipients</span>
                    <span class="count-badge" id="recipientBadge">0 found</span>
                </div>
                <p style="font-size: 11px; color: #64748b; margin-top: -12px; margin-bottom: 10px;">Paste emails (comma separated, new lines, or Excel copy)</p>
                <textarea id="recipients" style="min-height: 140px;" placeholder="john@example.com&#10;jane@example.com"></textarea>
            </div>

            <!-- BOTTOM RIGHT: Progress Monitor -->
            <div class="card">
                <div class="card-title">
                    <span><i class="fa-solid fa-chart-pie"></i> Progress Monitor</span>
                </div>

                <div class="stats-grid">
                    <div class="stat-box">
                        <div class="stat-label">TOTAL</div>
                        <div class="stat-value stat-total" id="statTotal">0</div>
                    </div>
                    <div class="stat-box">
                        <div class="stat-label">SENT</div>
                        <div class="stat-value stat-sent" id="statSent">0</div>
                    </div>
                    <div class="stat-box">
                        <div class="stat-label">FAILED</div>
                        <div class="stat-value stat-failed" id="statFailed">0</div>
                    </div>
                    <div class="stat-box">
                        <div class="stat-label">REMAINING</div>
                        <div class="stat-value stat-remaining" id="statRemaining">0</div>
                    </div>
                </div>

                <div class="progress-track">
                    <div class="progress-bar" id="progressBar"></div>
                </div>

                <div class="status-text" id="statusText">
                    <i class="fa-solid fa-circle-dot"></i> Ready to send
                </div>

                <div class="control-btns">
                    <button type="button" class="btn-action btn-send" id="sendBtn">
                        <i class="fa-solid fa-paper-plane"></i> Send All
                    </button>
                    <button type="button" class="btn-action btn-stop" id="stopBtn">
                        <i class="fa-solid fa-stop"></i> Stop Sending
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
<script src="script.js"></script>
</body>
</html>
