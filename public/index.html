<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Secure Mail Console</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
</head>
<body>

  <!-- Auth Modal -->
  <div id="authOverlay" class="auth-overlay">
    <div class="auth-box">
      <div class="logo">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#2563eb" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
        <span>Secure Mail Console</span>
      </div>
      <p class="auth-sub">Enter system password to access console</p>
      <input type="password" id="sitePassword" placeholder="Enter password..." autocomplete="off">
      <button id="authBtn" type="button">Access Console</button>
      <div id="authError" class="auth-error"></div>
    </div>
  </div>

  <div class="container">
    <!-- Header -->
    <header class="top-header">
      <div class="brand">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="#2563eb" stroke="#2563eb" stroke-width="0.5"><path d="M12 2L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-3z"/></svg>
        <span>Secure Mail Console</span>
      </div>
      <button class="logout-btn" id="logoutBtn" title="Double click to logout">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
        Logout (Double Click)
      </button>
    </header>

    <div class="page-title">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
      <h2>Bulk Email Sender</h2>
    </div>

    <!-- Main 2-Column Grid -->
    <div class="main-grid">
      <!-- Left Column: Compose Message -->
      <div class="card compose-card">
        <div class="card-title">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg>
          Compose Message
        </div>

        <div class="form-row">
          <div class="form-group">
            <label>Sender Name</label>
            <input type="text" id="senderName" placeholder="E.g., John Doe">
          </div>
          <div class="form-group">
            <label>Your Gmail</label>
            <input type="email" id="senderEmail" placeholder="you@gmail.com">
          </div>
        </div>

        <div class="form-row">
          <div class="form-group password-group">
            <label>App Password</label>
            <div class="password-wrapper">
              <input type="password" id="appPassword" placeholder="16-char app password">
              <span id="togglePassword" class="eye-icon">👁</span>
            </div>
          </div>
          <div class="form-group">
            <label>Email Subject</label>
            <input type="text" id="emailSubject" placeholder="Enter subject line...">
          </div>
        </div>

        <div class="form-group">
          <label>Message Body (Plain Text)</label>
          <textarea id="messageBody" rows="7" placeholder="Write your email here... Spintax supported: {Hi|Hello|Hey}"></textarea>
        </div>

        <div class="form-group">
          <label>Spam Protection</label>
          <div class="cf-turnstile" data-sitekey="1x0000000000000000000000000000000AA" data-theme="light" id="turnstileWidget"></div>
        </div>
      </div>

      <!-- Right Column: Recipients & Progress Monitor -->
      <div class="right-column">
        <!-- Recipients Card -->
        <div class="card recipients-card">
          <div class="recipients-header">
            <div class="card-title">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>
              Recipients
            </div>
            <span class="found-tag" id="recipientCount">0 found</span>
          </div>
          <p class="recipients-sub">Paste emails (comma separated, new lines, or Excel copy)</p>
          <textarea id="recipientList" rows="5" placeholder="john@example.com&#10;jane@example.com"></textarea>
        </div>

        <!-- Progress Monitor Card -->
        <div class="card progress-card">
          <div class="card-title">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
            Progress Monitor
          </div>

          <div class="stats-grid">
            <div class="stat-box">
              <div class="stat-label">TOTAL</div>
              <div class="stat-num" id="statTotal">0</div>
            </div>
            <div class="stat-box">
              <div class="stat-label">SENT</div>
              <div class="stat-num stat-sent" id="statSent">0</div>
            </div>
            <div class="stat-box">
              <div class="stat-label">FAILED</div>
              <div class="stat-num stat-failed" id="statFailed">0</div>
            </div>
            <div class="stat-box">
              <div class="stat-label">REMAINING</div>
              <div class="stat-num stat-remaining" id="statRemaining">0</div>
            </div>
          </div>

          <div class="status-indicator">
            <span class="dot" id="statusDot"></span>
            <span id="statusText">Ready to send</span>
          </div>

          <div class="btn-row">
            <button type="button" class="send-btn" id="sendBtn">
              <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
              Send All
            </button>
            <button type="button" class="stop-btn" id="stopBtn" style="display:none;">
              Stop
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
