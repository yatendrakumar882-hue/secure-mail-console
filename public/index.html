<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cloud Mailer Pro</title>
  <script src="/socket.io/socket.io.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    body { background: #0f172a; color: #f8fafc; padding: 24px; }
    .container { max-width: 900px; margin: 0 auto; background: #1e293b; border-radius: 12px; padding: 24px; border: 1px solid #334155; }
    h1 { font-size: 20px; font-weight: 600; margin-bottom: 20px; color: #38bdf8; display: flex; align-items: center; justify-content: space-between; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 16px; }
    .form-group { display: flex; flex-direction: column; gap: 6px; }
    .full-width { grid-column: span 2; }
    label { font-size: 13px; font-weight: 500; color: #94a3b8; }
    input, textarea { background: #0f172a; border: 1px solid #334155; border-radius: 6px; padding: 10px 12px; color: #fff; font-size: 14px; outline: none; width: 100%; }
    input:focus, textarea:focus { border-color: #38bdf8; }
    textarea { resize: vertical; }
    .btn-group { display: flex; gap: 12px; margin-top: 16px; }
    button { padding: 10px 20px; border-radius: 6px; font-size: 14px; font-weight: 600; cursor: pointer; border: none; transition: 0.2s; }
    .btn-primary { background: #0284c7; color: white; }
    .btn-primary:hover { background: #0369a1; }
    .btn-danger { background: #e11d48; color: white; }
    .btn-danger:hover { background: #be123c; }
    .stats { display: flex; gap: 16px; margin-top: 20px; padding: 12px; background: #0f172a; border-radius: 6px; border: 1px solid #334155; font-size: 13px; }
    .log-box { margin-top: 16px; background: #0f172a; border: 1px solid #334155; border-radius: 6px; height: 180px; overflow-y: auto; padding: 12px; font-family: monospace; font-size: 12px; }
    .log-success { color: #4ade80; }
    .log-error { color: #f87171; }
    .modal { display: none; position: fixed; inset: 0; background: rgba(0, 0, 0, 0.7); align-items: center; justify-content: center; z-index: 50; }
    .modal-content { background: #1e293b; padding: 24px; border-radius: 12px; max-width: 400px; text-align: center; border: 1px solid #ef4444; }
  </style>
</head>
<body>

<div class="container">
  <h1>⚡ Cloud Mailer Pro <span style="font-size: 12px; color: #94a3b8; font-weight: normal;">6-Batch Engine</span></h1>

  <div class="grid">
    <div class="form-group">
      <label>Sender Gmail ID</label>
      <input type="email" id="email" placeholder="example@gmail.com" />
    </div>
    <div class="form-group">
      <label>App Password (16-char)</label>
      <input type="password" id="appPassword" placeholder="abcd efgh ijkl mnop" />
    </div>
    <div class="form-group full-width">
      <label>Sender Name</label>
      <input type="text" id="senderName" placeholder="Your Name or Business Name" />
    </div>
    <div class="form-group full-width">
      <label>Subject Line</label>
      <input type="text" id="subject" placeholder="{Hi|Hello} {FirstName}, quick update" />
    </div>
    <div class="form-group full-width">
      <label>Recipients (1 per line or Name &lt;email&gt;)</label>
      <textarea id="recipients" rows="4" placeholder="client1@domain.com&#10;John Doe <client2@domain.com>"></textarea>
    </div>
    <div class="form-group full-width">
      <label>Email Message Template (Spintax & Variables Supported)</label>
      <textarea id="messageBody" rows="5" placeholder="{Hi|Hello} {FirstName},&#10;&#10;I noticed your website design and wanted to check if you're open for feedback.&#10;&#10;Best regards,"></textarea>
    </div>
  </div>

  <div class="btn-group">
    <button class="btn-primary" id="startBtn" onclick="startSending()">Start Campaign</button>
    <button class="btn-danger" id="stopBtn" onclick="stopSending()">Stop</button>
  </div>

  <div class="stats">
    <div>Total: <span id="totalCount">0</span></div>
    <div>Sent: <span id="sentCount" style="color: #4ade80;">0</span></div>
    <div>Failed: <span id="failedCount" style="color: #f87171;">0</span></div>
  </div>

  <div class="log-box" id="logBox"></div>
</div>

<div class="modal" id="limitModal">
  <div class="modal-content">
    <h3 style="color: #ef4444; margin-bottom: 8px;">⚠️ Limit Full</h3>
    <p id="limitMsg" style="font-size: 13px; color: #cbd5e1; margin-bottom: 16px;"></p>
    <button class="btn-primary" onclick="closeModal()">Acknowledge</button>
  </div>
</div>

<script>
  const socket = io();
  let sent = 0, failed = 0, total = 0;

  function log(msg, type = 'info') {
    const box = document.getElementById('logBox');
    const line = document.createElement('div');
    line.className = type === 'success' ? 'log-success' : type === 'error' ? 'log-error' : '';
    line.textContent = `[${new Date().toLocaleTimeString()}] ${msg}`;
    box.appendChild(line);
    box.scrollTop = box.scrollHeight;
  }

  socket.on('mail_sent', (data) => {
    sent++;
    document.getElementById('sentCount').textContent = sent;
    log(`Sent -> ${data.recipient}`, 'success');
  });

  socket.on('mail_error', (data) => {
    failed++;
    document.getElementById('failedCount').textContent = failed;
    log(`Failed -> ${data.recipient} (${data.error})`, 'error');

    if (data.isLimitFull) {
      document.getElementById('limitMsg').textContent = data.error;
      document.getElementById('limitModal').style.display = 'flex';
    }
  });

  function closeModal() {
    document.getElementById('limitModal').style.display = 'none';
  }

  async function startSending() {
    const email = document.getElementById('email').value.trim();
    const appPassword = document.getElementById('appPassword').value.trim();
    const senderName = document.getElementById('senderName').value.trim();
    const subject = document.getElementById('subject').value.trim();
    const messageBody = document.getElementById('messageBody').value.trim();
    const rawRecipients = document.getElementById('recipients').value.trim().split('\n').filter(Boolean);

    if (!email || !appPassword || !rawRecipients.length) {
      alert('Please fill email credentials and at least 1 recipient.');
      return;
    }

    sent = 0; failed = 0;
    total = rawRecipients.length;
    document.getElementById('totalCount').textContent = total;
    document.getElementById('sentCount').textContent = '0';
    document.getElementById('failedCount').textContent = '0';
    document.getElementById('logBox').innerHTML = '';

    log('Starting stream connection...', 'info');

    try {
      const res = await fetch('/api/send-stream', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, appPassword, senderName, subject, messageBody, recipients: rawRecipients })
      });

      const reader = res.body.getReader();
      const decoder = new TextDecoder();

      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        const chunk = decoder.decode(value);
        if (chunk.includes('[DONE]')) {
          log('Campaign finished successfully.', 'info');
        }
      }
    } catch (err) {
      log(`Stream Error: ${err.message}`, 'error');
    }
  }

  async function stopSending() {
    await fetch('/api/stop', { method: 'POST' });
    log('Stopping request sent...', 'info');
  }
</script>
</body>
</html>
