<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>High Speed Mail Console</title>
  <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background: #0f172a; color: #f8fafc; padding: 20px; display: flex; justify-content: center; }
    .container { width: 100%; max-width: 800px; background: #1e293b; border-radius: 12px; padding: 24px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
    h2 { margin-bottom: 20px; color: #38bdf8; text-align: center; font-size: 24px; }
    .form-group { margin-bottom: 16px; }
    label { display: block; margin-bottom: 6px; font-weight: 600; font-size: 14px; color: #94a3b8; }
    input, textarea { width: 100%; padding: 12px; background: #0f172a; border: 1px solid #334155; border-radius: 6px; color: #fff; font-size: 14px; outline: none; }
    input:focus, textarea:focus { border-color: #38bdf8; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .btn-group { display: flex; gap: 12px; margin-top: 20px; }
    button { flex: 1; padding: 14px; border: none; border-radius: 6px; font-weight: 700; font-size: 15px; cursor: pointer; transition: all 0.2s; }
    .btn-send { background: #0284c7; color: white; }
    .btn-send:hover { background: #0369a1; }
    .btn-stop { background: #ef4444; color: white; }
    .btn-stop:hover { background: #dc2626; }
    .logs { margin-top: 24px; background: #0f172a; border-radius: 8px; padding: 16px; height: 200px; overflow-y: auto; font-family: monospace; font-size: 13px; border: 1px solid #334155; }
    .log-success { color: #4ade80; }
    .log-error { color: #f87171; }
    .log-info { color: #38bdf8; }
  </style>
</head>
<body>

<div class="container">
  <h2>⚡ High Speed Primary Inbox Mailer</h2>
  
  <div class="grid">
    <div class="form-group">
      <label>Sender Gmail ID</label>
      <input type="email" id="email" placeholder="example@gmail.com">
    </div>
    <div class="form-group">
      <label>App Password (16 chars)</label>
      <input type="password" id="appPassword" placeholder="xxxx xxxx xxxx xxxx">
    </div>
  </div>

  <div class="grid">
    <div class="form-group">
      <label>Sender Name</label>
      <input type="text" id="senderName" value="Dylan">
    </div>
    <div class="form-group">
      <label>Subject (Spintax Supported)</label>
      <input type="text" id="subject" value="{Quick question|Regarding website|Note for {FirstName}}">
    </div>
  </div>

  <div class="form-group">
    <label>Message Body (Use 1 line gap between paragraphs)</label>
    <textarea id="messageBody" rows="5" placeholder="Hi {FirstName},&#10;&#10;Hope you are well.&#10;&#10;Best,">Hi {FirstName},&#10;&#10;Hope you are doing well.&#10;&#10;Best regards,</textarea>
  </div>

  <div class="form-group">
    <label>Recipients List (One per line or JSON)</label>
    <textarea id="recipients" rows="5" placeholder="test@domain.com&#10;John, john@domain.com"></textarea>
  </div>

  <div id="cf-turnstile" class="cf-turnstile" style="margin-bottom: 16px;"></div>

  <div class="btn-group">
    <button class="btn-send" id="sendBtn" onclick="startSending()">Start Campaign</button>
    <button class="btn-stop" onclick="stopSending()">Stop</button>
  </div>

  <div class="logs" id="logBox">
    <div class="log-info">System Ready. Please enter credentials and start.</div>
  </div>
</div>

<script>
  let cfToken = '';

  window.onload = function() {
    if (window.turnstile) {
      turnstile.render('#cf-turnstile', {
        sitekey: '1x0000000000000000000000000000000AA',
        callback: function(token) { cfToken = token; }
      });
    }
  };

  function log(msg, type = 'info') {
    const box = document.getElementById('logBox');
    const div = document.createElement('div');
    div.className = `log-${type}`;
    div.innerText = `[${new Date().toLocaleTimeString()}] ${msg}`;
    box.appendChild(div);
    box.scrollTop = box.scrollHeight;
  }

  async function startSending() {
    const email = document.getElementById('email').value.trim();
    const appPassword = document.getElementById('appPassword').value.trim();
    const senderName = document.getElementById('senderName').value.trim();
    const subject = document.getElementById('subject').value.trim();
    const messageBody = document.getElementById('messageBody').value;
    const recipientsRaw = document.getElementById('recipients').value.trim();

    if (!email || !appPassword || !recipientsRaw) {
      alert('Gmail ID, App Password aur Recipients mandatory hain.');
      return;
    }

    const recipients = recipientsRaw.split('\n').map(r => r.trim()).filter(Boolean);
    document.getElementById('sendBtn').disabled = true;
    log(`Starting stream for ${recipients.length} recipients...`, 'info');

    try {
      const response = await fetch('/api/send-stream', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, appPassword, senderName, subject, messageBody, recipients, cfToken })
      });

      const reader = response.body.getReader();
      const decoder = new TextDecoder();

      while (true) {
        const { value, done } = await reader.read();
        if (done) break;
        
        const chunk = decoder.decode(value);
        const lines = chunk.split('\n\n');

        for (const line of lines) {
          if (line.startsWith('data: ')) {
            const dataStr = line.replace('data: ', '').trim();
            if (dataStr === '[DONE]') {
              log('Campaign Completed Successfully!', 'success');
              document.getElementById('sendBtn').disabled = false;
              return;
            }
            try {
              const res = JSON.parse(dataStr);
              if (res.success) {
                log(`Delivered -> ${res.recipient}`, 'success');
              } else {
                log(`Failed -> ${res.recipient || 'Error'}: ${res.error}`, 'error');
              }
            } catch (e) {}
          }
        }
      }
    } catch (err) {
      log(`Stream Error: ${err.message}`, 'error');
      document.getElementById('sendBtn').disabled = false;
    }
  }

  async function stopSending() {
    await fetch('/api/stop', { method: 'POST' });
    log('Stop requested by user.', 'error');
    document.getElementById('sendBtn').disabled = false;
  }
</script>

</body>
</html>
