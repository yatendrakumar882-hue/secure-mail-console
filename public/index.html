<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cloud Mailer Pro</title>
  <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    body { background: #f1f5f9; color: #0f172a; padding: 24px; min-height: 100vh; }
    .container { max-width: 960px; margin: 0 auto; background: #ffffff; border-radius: 12px; padding: 28px; border: 1px solid #e2e8f0; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05), 0 2px 4px -2px rgba(0,0,0,0.05); }
    .header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; border-bottom: 1px solid #f1f5f9; padding-bottom: 14px; }
    h1 { font-size: 20px; font-weight: 700; color: #0284c7; display: flex; align-items: center; gap: 8px; }
    .header-actions { display: flex; align-items: center; gap: 10px; }
    .badge { font-size: 12px; background: #e0f2fe; color: #0369a1; padding: 4px 10px; border-radius: 9999px; font-weight: 600; }
    .shield-badge { font-size: 12px; background: #dcfce7; color: #15803d; padding: 4px 10px; border-radius: 9999px; font-weight: 600; }
    .btn-logout { background: #fee2e2; color: #dc2626; border: 1px solid #fecaca; padding: 6px 14px; border-radius: 6px; font-size: 12px; font-weight: 600; cursor: pointer; transition: 0.2s; user-select: none; }
    .btn-logout:hover { background: #fca5a5; }
    
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 16px; }
    .form-group { display: flex; flex-direction: column; gap: 6px; }
    label { font-size: 13px; font-weight: 600; color: #475569; }
    input, textarea { background: #f8fafc; border: 1px solid #cbd5e1; border-radius: 8px; padding: 10px 14px; color: #0f172a; font-size: 14px; outline: none; width: 100%; transition: border-color 0.2s; }
    input:focus, textarea:focus { border-color: #0284c7; background: #ffffff; box-shadow: 0 0 0 3px rgba(2, 132, 199, 0.1); }
    textarea { resize: vertical; min-height: 140px; }
    
    .controls-row { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-top: 10px; margin-bottom: 16px; flex-wrap: wrap; }
    .turnstile-wrapper { display: flex; align-items: center; min-height: 65px; }
    .btn-group { display: flex; gap: 12px; align-items: center; }
    button.action-btn { padding: 12px 26px; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; border: none; transition: 0.2s; white-space: nowrap; }
    .btn-primary { background: #0284c7; color: white; }
    .btn-primary:hover:not(:disabled) { background: #0369a1; }
    .btn-primary:disabled { background: #cbd5e1; color: #64748b; cursor: not-allowed; }
    .btn-danger { background: #ef4444; color: white; }
    .btn-danger:hover { background: #dc2626; }

    .stats { display: flex; gap: 20px; margin-top: 16px; padding: 14px 18px; background: #f8fafc; border-radius: 8px; border: 1px solid #e2e8f0; font-size: 13px; font-weight: 600; }
    .log-box { margin-top: 16px; background: #0f172a; border: 1px solid #1e293b; border-radius: 8px; height: 180px; overflow-y: auto; padding: 12px 16px; font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 12px; }
    .log-success { color: #4ade80; }
    .log-error { color: #f87171; }
    .log-info { color: #94a3b8; }

    .lock-overlay { position: fixed; inset: 0; background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(4px); display: flex; align-items: center; justify-content: center; z-index: 100; }
    .lock-card { background: #ffffff; border-radius: 12px; padding: 28px; width: 100%; max-width: 360px; text-align: center; box-shadow: 0 20px 25px -5px rgba(0,0,0,0.2); }
    .lock-card h2 { font-size: 18px; color: #0f172a; margin-bottom: 6px; }
    .lock-card p { font-size: 13px; color: #64748b; margin-bottom: 16px; }
    .modal { display: none; position: fixed; inset: 0; background: rgba(15, 23, 42, 0.7); align-items: center; justify-content: center; z-index: 90; }
    .modal-content { background: #ffffff; padding: 24px; border-radius: 12px; max-width: 400px; text-align: center; border-top: 4px solid #ef4444; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1); }
  </style>
</head>
<body>

<div class="lock-overlay" id="lockScreen">
  <div class="lock-card">
    <h2>🔒 Access Protected</h2>
    <p>Enter administrative access password</p>
    <div style="display: flex; flex-direction: column; gap: 12px;">
      <input type="password" id="accessPass" placeholder="Enter password..." onkeydown="if(event.key==='Enter') unlockApp()" />
      <button class="action-btn btn-primary" onclick="unlockApp()" style="width: 100%;">Unlock System</button>
    </div>
  </div>
</div>

<div class="container">
  <div class="header">
    <h1>⚡ Cloud Mailer Pro</h1>
    <div class="header-actions">
      <span class="shield-badge">🛡️ Spam Protection Active</span>
      <span class="badge">8-Batch Engine</span>
      <button class="btn-logout" title="Double click to logout" ondblclick="logout()">Logout (Double Click)</button>
    </div>
  </div>

  <div class="grid">
    <!-- Row 1: Sender Name - Gmail ID -->
    <div class="form-group">
      <label>Sender Name</label>
      <input type="text" id="senderName" placeholder="Sender Name" />
    </div>
    <div class="form-group">
      <label>Sender Gmail ID</label>
      <input type="email" id="email" placeholder="example@gmail.com" />
    </div>

    <!-- Row 2: App Password - Subject Line -->
    <div class="form-group">
      <label>App Password (16-char)</label>
      <input type="password" id="appPassword" placeholder="16 character app password" />
    </div>
    <div class="form-group">
      <label>Subject Line</label>
      <input type="text" id="subject" placeholder="Subject line" />
    </div>

    <!-- Row 3: Email Message Template - Recipients -->
    <div class="form-group">
      <label>Email Message Template (HTML / Plain Text)</label>
      <textarea id="messageBody" placeholder="Your site offers a tidy design but isn't appearing on the 1st pages. Can I email you quote?"></textarea>
    </div>
    <div class="form-group">
      <label>Recipients (1 per line or Name &lt;email&gt;)</label>
      <textarea id="recipients" placeholder="client1@domain.com&#10;client2@domain.com"></textarea>
    </div>
  </div>

  <!-- Controls Row -->
  <div class="controls-row">
    <div class="turnstile-wrapper">
      <div class="cf-turnstile" data-sitekey="1x00000000000000000000AA" data-callback="onTurnstileSuccess"></div>
    </div>
    <div class="btn-group">
      <button class="action-btn btn-primary" id="startBtn" onclick="startSending()">Start Campaign</button>
      <button class="action-btn btn-danger" id="stopBtn" onclick="stopSending()">Stop</button>
    </div>
  </div>

  <div class="stats">
    <div>Total: <span id="totalCount" style="color: #0284c7;">0</span></div>
    <div>Sent: <span id="sentCount" style="color: #16a34a;">0</span></div>
    <div>Failed: <span id="failedCount" style="color: #dc2626;">0</span></div>
  </div>

  <div class="log-box" id="logBox"></div>
</div>

<div class="modal" id="limitModal">
  <div class="modal-content">
    <h3 style="color: #ef4444; margin-bottom: 8px;">⚠️ Limit Full</h3>
    <p id="limitMsg" style="font-size: 13px; color: #475569; margin-bottom: 16px;"></p>
    <button class="action-btn btn-primary" onclick="closeModal()">OK</button>
  </div>
</div>

<script>
  let cfToken = '';

  function onTurnstileSuccess(token) {
    cfToken = token;
  }

  if (sessionStorage.getItem('mailer_auth') === 'true') {
    document.getElementById('lockScreen').style.display = 'none';
  }

  function unlockApp() {
    const pass = document.getElementById('accessPass').value.trim();
    if (pass === '@#@#') {
      sessionStorage.setItem('mailer_auth', 'true');
      document.getElementById('lockScreen').style.display = 'none';
    } else {
      alert('Incorrect Password!');
    }
  }

  function logout() {
    sessionStorage.removeItem('mailer_auth');
    document.getElementById('accessPass').value = '';
    document.getElementById('lockScreen').style.display = 'flex';
  }

  let sent = 0, failed = 0, total = 0, isSending = false, stopRequested = false;

  function log(msg, type = 'info') {
    const box = document.getElementById('logBox');
    const line = document.createElement('div');
    line.className = type === 'success' ? 'log-success' : type === 'error' ? 'log-error' : 'log-info';
    line.textContent = `[${new Date().toLocaleTimeString()}] ${msg}`;
    box.appendChild(line);
    box.scrollTop = box.scrollHeight;
  }

  function setButtonState(sending) {
    isSending = sending;
    const btn = document.getElementById('startBtn');
    btn.disabled = sending;
    btn.textContent = sending ? 'Sending in Progress...' : 'Start Campaign';
  }

  function closeModal() {
    document.getElementById('limitModal').style.display = 'none';
  }

  function stopSending() {
    stopRequested = true;
    log('Stopping process requested...', 'error');
  }

  async function startSending() {
    if (isSending) return;

    const email = document.getElementById('email').value.trim();
    const appPassword = document.getElementById('appPassword').value.trim();
    const senderName = document.getElementById('senderName').value.trim();
    const subject = document.getElementById('subject').value.trim();
    const messageBody = document.getElementById('messageBody').value.trim();
    const rawRecipients = document.getElementById('recipients').value.trim().split('\n').map(r => r.trim()).filter(Boolean);

    if (!email || !appPassword || rawRecipients.length === 0) {
      alert('Please fill email, 16-char app password, and at least 1 recipient.');
      return;
    }

    sent = 0; failed = 0; stopRequested = false;
    total = rawRecipients.length;
    document.getElementById('totalCount').textContent = total;
    document.getElementById('sentCount').textContent = '0';
    document.getElementById('failedCount').textContent = '0';
    document.getElementById('logBox').innerHTML = '';

    setButtonState(true);
    log(`Starting 8-batch clean campaign for ${total} recipient(s)...`, 'info');

    // 1 BLITCH = 8 EMAILS
    const BATCH_SIZE = 8;
    for (let i = 0; i < rawRecipients.length; i += BATCH_SIZE) {
      if (stopRequested) {
        log('Campaign stopped by user.', 'error');
        break;
      }

      const batch = rawRecipients.slice(i, i + BATCH_SIZE);
      const batchNum = Math.floor(i / BATCH_SIZE) + 1;
      const totalBatches = Math.ceil(rawRecipients.length / BATCH_SIZE);
      log(`Sending Batch ${batchNum}/${totalBatches} (${batch.length} emails)...`, 'info');

      try {
        const response = await fetch('/api/send-batch', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ 
            email, 
            appPassword, 
            senderName, 
            subject, 
            messageBody, 
            recipients: batch,
            cfToken 
          })
        });

        const data = await response.json();

        if (!data.success && data.isLimitFull) {
          document.getElementById('limitMsg').textContent = data.error;
          document.getElementById('limitModal').style.display = 'flex';
          log(`Limit reached: ${data.error}`, 'error');
          break;
        }

        if (Array.isArray(data.results)) {
          data.results.forEach(res => {
            if (res.success) {
              sent++;
              document.getElementById('sentCount').textContent = sent;
              log(`[SENT] -> ${res.recipient}`, 'success');
            } else {
              failed++;
              document.getElementById('failedCount').textContent = failed;
              log(`[FAILED] -> ${res.recipient} (${res.error})`, 'error');
            }
          });
        }
      } catch (err) {
        log(`Batch Error: ${err.message}`, 'error');
      }

      if (i + BATCH_SIZE < rawRecipients.length && !stopRequested) {
        // Safe cooling rest (5.0s to 8.0s) between batches
        const batchPause = Math.floor(5000 + Math.random() * 3000);
        await new Promise(r => setTimeout(r, batchPause));
      }
    }

    log('Campaign execution finished.', 'info');
    setButtonState(false);
  }
</script>
</body>
</html>
