<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bulk Email Sender</title>
  <style>
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: #0f172a; color: #f8fafc; margin: 0; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
    .card { background: #1e293b; border-radius: 12px; padding: 24px; width: 100%; max-width: 850px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
    h2 { margin-top: 0; color: #38bdf8; font-size: 22px; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 16px; }
    label { display: block; font-size: 13px; color: #94a3b8; margin-bottom: 5px; }
    input, textarea { width: 100%; background: #0f172a; border: 1px solid #334155; border-radius: 6px; padding: 10px; color: #fff; font-size: 14px; }
    textarea { height: 110px; resize: none; }
    .btn { background: #2563eb; color: #fff; border: none; border-radius: 6px; padding: 12px; width: 100%; font-size: 15px; font-weight: 600; cursor: pointer; transition: 0.2s; }
    .btn:hover { background: #1d4ed8; }
    .btn:disabled { background: #475569; cursor: not-allowed; }
    .stats { display: flex; justify-content: space-around; background: #0f172a; border-radius: 8px; padding: 14px; margin-top: 16px; text-align: center; }
    .stat-box h4 { margin: 0; font-size: 20px; color: #38bdf8; }
    .stat-box span { font-size: 12px; color: #64748b; }
    #loginBox { max-width: 400px; text-align: center; }
    .hidden { display: none !important; }
    #logOutput { margin-top: 15px; font-size: 13px; max-height: 120px; overflow-y: auto; color: #cbd5e1; background: #0b1120; padding: 10px; border-radius: 6px; }
  </style>
</head>
<body>

  <!-- Access Protected Login Modal -->
  <div id="loginBox" class="card">
    <h2>Access Protected</h2>
    <p style="color:#94a3b8; font-size: 13px;">Enter the password to continue</p>
    <input type="password" id="passInput" placeholder="Password (@##)" style="margin-bottom: 15px;" />
    <button class="btn" onclick="authenticate()">Unlock Console</button>
    <p id="loginError" style="color: #ef4444; font-size: 13px; margin-top: 10px; display: none;">Invalid Password</p>
  </div>

  <!-- Main Bulk Sender Console -->
  <div id="mainConsole" class="card hidden">
    <h2>Bulk Email Sender</h2>
    <div class="grid">
      <div>
        <label>Sender Name</label>
        <input type="text" id="senderName" value="Warren" />
      </div>
      <div>
        <label>Your Gmail</label>
        <input type="email" id="senderEmail" placeholder="yourname@gmail.com" />
      </div>
    </div>
    <div class="grid">
      <div>
        <label>App Password (16 Letters)</label>
        <input type="password" id="appPassword" placeholder="abcd efgh ijkl mnop" />
      </div>
      <div>
        <label>Email Subject</label>
        <input type="text" id="subject" value="Account Notification Update" />
      </div>
    </div>
    <div class="grid">
      <div>
        <label>Message Body (Plain Text / HTML)</label>
        <textarea id="bodyText">Hi, please check your document update details.</textarea>
      </div>
      <div>
        <label>Recipients (1 per line or comma-separated)</label>
        <textarea id="recipients" placeholder="client1@gmail.com&#10;client2@gmail.com"></textarea>
      </div>
    </div>

    <button class="btn" id="sendBtn" onclick="startDispatch()">Send 6 Emails Batch</button>

    <div class="stats">
      <div class="stat-box"><h4 id="statTotal">0</h4><span>TOTAL</span></div>
      <div class="stat-box"><h4 id="statSent" style="color:#22c55e;">0</h4><span>SENT</span></div>
      <div class="stat-box"><h4 id="statFailed" style="color:#ef4444;">0</h4><span>FAILED</span></div>
    </div>

    <div id="logOutput">Ready to dispatch.</div>
  </div>

  <script>
    async function authenticate() {
      const password = document.getElementById("passInput").value;
      const res = await fetch("/api/login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ password })
      });
      const data = await res.json();
      if (data.success) {
        document.getElementById("loginBox").classList.add("hidden");
        document.getElementById("mainConsole").classList.remove("hidden");
      } else {
        document.getElementById("loginError").style.display = "block";
      }
    }

    async function startDispatch() {
      const btn = document.getElementById("sendBtn");
      const log = document.getElementById("logOutput");
      const senderEmail = document.getElementById("senderEmail").value.trim();
      const appPassword = document.getElementById("appPassword").value.trim();
      const recipients = document.getElementById("recipients").value.trim();
      const subject = document.getElementById("subject").value;
      const bodyText = document.getElementById("bodyText").value;
      const senderName = document.getElementById("senderName").value;

      if (!senderEmail || !appPassword || !recipients) {
        alert("Please fill Sender Email, App Password, and Recipients.");
        return;
      }

      btn.disabled = true;
      btn.innerText = "Processing Batch...";
      log.innerText = "Connecting via Proxy & dispatching batch...";

      try {
        const response = await fetch("/api/send-batch", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ senderEmail, appPassword, recipients, subject, bodyText, senderName })
        });

        const resData = await response.json();

        if (resData.success) {
          document.getElementById("statTotal").innerText = resData.results.length;
          document.getElementById("statSent").innerText = resData.sentCount;
          document.getElementById("statFailed").innerText = resData.failedCount;
          
          let logDetails = resData.results.map(r => `${r.email} : ${r.status}`).join("\n");
          log.innerText = "Done!\n" + logDetails;
          alert(`Batch complete! Sent: ${resData.sentCount}, Failed: ${resData.failedCount}`);
        } else {
          log.innerText = "Error: " + (resData.error || "Failed to dispatch");
          alert("Error: " + resData.error);
        }
      } catch (err) {
        log.innerText = "Network Error: " + err.message;
        alert("Connection Error. Please check credentials.");
      } finally {
        btn.disabled = false;
        btn.innerText = "Send 6 Emails Batch";
      }
    }
  </script>
</body>
</html>
