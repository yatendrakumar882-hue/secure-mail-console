<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Secure Mail Console</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { background-color: #0b0f19; }
  </style>
</head>
<body class="text-slate-100 min-h-screen flex items-center justify-center p-4">

  <!-- ================= AUTH CONTAINER (SMS OTP ONLY) ================= -->
  <div id="authContainer" class="w-full max-w-md bg-slate-900 border border-slate-800 rounded-2xl p-8 shadow-2xl">
    <div class="text-center mb-6">
      <div class="w-14 h-14 bg-indigo-600/20 text-indigo-400 rounded-2xl flex items-center justify-center mx-auto mb-4 border border-indigo-500/30">
        <svg class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 18h.01M8 21h8a2 2 0 002-2V5a2 2 0 00-2-2H8a2 2 0 00-2 2v14a2 2 0 002 2z"/></svg>
      </div>
      <h2 id="authTitle" class="text-2xl font-bold">Secure Access</h2>
      <p id="authSubtitle" class="text-sm text-slate-400 mt-1">Enter authorized mobile number to receive OTP</p>
    </div>

    <!-- Alert Box -->
    <div id="authAlert" class="hidden mb-4 p-3 rounded-lg text-sm bg-rose-950/50 border border-rose-800/60 text-rose-300"></div>

    <!-- Step 1: Phone Form -->
    <form id="phoneForm" class="space-y-4">
      <div>
        <label class="text-xs text-slate-400 font-medium block mb-1">Mobile Number</label>
        <div class="relative">
          <span class="absolute left-4 top-3.5 text-slate-500 font-medium">+91</span>
          <input type="tel" id="phoneInput" required maxlength="10" placeholder="6395991106" class="w-full pl-14 pr-4 py-3 bg-slate-950 border border-slate-700 rounded-xl focus:outline-none focus:border-indigo-500 text-white placeholder-slate-600 font-mono text-base" value="6395991106">
        </div>
      </div>
      <button type="submit" id="phoneBtn" class="w-full py-3 bg-indigo-600 hover:bg-indigo-500 rounded-xl font-medium transition shadow-lg shadow-indigo-600/30">Send SMS OTP</button>
    </form>

    <!-- Step 2: OTP Form -->
    <form id="otpForm" class="space-y-4 hidden">
      <div class="bg-indigo-950/30 border border-indigo-800/40 p-3 rounded-xl text-xs text-indigo-300 text-center mb-2">
        SMS OTP sent to: <span id="phoneDisplay" class="font-semibold text-white">+91 6395991106</span>
      </div>
      <div>
        <label class="text-xs text-slate-400 font-medium block mb-1 text-center">6-Digit Verification Code</label>
        <input type="text" id="otpInput" maxlength="6" required placeholder="••••••" class="w-full px-4 py-3 bg-slate-950 border border-slate-700 rounded-xl focus:outline-none focus:border-indigo-500 text-center tracking-widest text-2xl font-bold text-white placeholder-slate-700">
      </div>
      <button type="submit" id="otpBtn" class="w-full py-3 bg-emerald-600 hover:bg-emerald-500 rounded-xl font-medium transition shadow-lg shadow-emerald-600/30">Verify OTP & Open Launcher</button>
      <button type="button" id="backBtn" class="w-full text-xs text-slate-500 hover:text-slate-300 transition text-center mt-2">Change Mobile Number</button>
    </form>
  </div>

  <!-- ================= MAIN LAUNCHER CONSOLE ================= -->
  <div id="mainDashboard" class="hidden w-full max-w-5xl bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-2xl">
    <div class="flex justify-between items-center border-b border-slate-800 pb-4 mb-6">
      <div class="flex items-center gap-3">
        <div class="w-3 h-3 rounded-full bg-emerald-500 animate-pulse"></div>
        <h1 class="text-xl font-bold">Secure Mail Console <span class="text-xs bg-indigo-950 border border-indigo-700 text-indigo-300 px-2 py-0.5 rounded-full ml-2">Primary Inbox 5-Batch Engine</span></h1>
      </div>
      <button onclick="location.reload()" class="text-xs bg-slate-800 hover:bg-slate-700 px-3 py-1.5 rounded-lg border border-slate-700 text-slate-300">Logout</button>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
      <!-- Left Config -->
      <div class="space-y-4">
        <div>
          <label class="text-xs text-slate-400 font-medium">Sender Email (Gmail)</label>
          <input type="email" id="smtpEmail" placeholder="your-email@gmail.com" class="w-full mt-1 px-3 py-2 bg-slate-950 border border-slate-800 rounded-lg text-sm text-white">
        </div>
        <div>
          <label class="text-xs text-slate-400 font-medium">App Password (16-char)</label>
          <input type="password" id="smtpPass" placeholder="xxxx xxxx xxxx xxxx" class="w-full mt-1 px-3 py-2 bg-slate-950 border border-slate-800 rounded-lg text-sm text-white">
        </div>
        <div>
          <label class="text-xs text-slate-400 font-medium">Sender Display Name</label>
          <input type="text" id="senderName" placeholder="John Doe" class="w-full mt-1 px-3 py-2 bg-slate-950 border border-slate-800 rounded-lg text-sm text-white">
        </div>
        <div>
          <label class="text-xs text-slate-400 font-medium">Recipients (one per line or CSV)</label>
          <textarea id="recipients" rows="6" placeholder="client1@example.com, John&#10;client2@example.com" class="w-full mt-1 px-3 py-2 bg-slate-950 border border-slate-800 rounded-lg text-xs font-mono text-white"></textarea>
        </div>
      </div>

      <!-- Right Controls -->
      <div class="md:col-span-2 space-y-4">
        <div>
          <label class="text-xs text-slate-400 font-medium">Subject Line (Spintax Supported)</label>
          <input type="text" id="subject" placeholder="{quick note|audit reports|feedback}" class="w-full mt-1 px-3 py-2 bg-slate-950 border border-slate-800 rounded-lg text-sm font-mono text-white">
        </div>
        <div>
          <label class="text-xs text-slate-400 font-medium">Message Body (Spintax Supported)</label>
          <textarea id="body" rows="9" placeholder="{Hi {Name},|Hello {Name},}&#10;&#10;Your site looks appealing but isn't visible on top results. Would you like to review reports?" class="w-full mt-1 px-3 py-2 bg-slate-950 border border-slate-800 rounded-lg text-xs font-mono text-white"></textarea>
        </div>
        <div class="flex gap-3">
          <button id="startBtn" class="flex-1 py-2.5 bg-indigo-600 hover:bg-indigo-500 rounded-xl font-medium text-sm transition">Start 5-Batch Sending</button>
          <button id="stopBtn" class="px-6 py-2.5 bg-rose-600 hover:bg-rose-500 rounded-xl font-medium text-sm transition">Stop</button>
        </div>
      </div>
    </div>

    <!-- Live Logs -->
    <div class="mt-6 border-t border-slate-800 pt-4">
      <div class="text-xs font-semibold text-slate-400 mb-2">Live Stream Logs</div>
      <div id="logBox" class="bg-slate-950 border border-slate-800 rounded-xl p-3 h-36 overflow-y-auto text-xs font-mono space-y-1">
        <div class="text-slate-600">Console ready. Awaiting campaign launch...</div>
      </div>
    </div>
  </div>

  <!-- Scripts -->
  <script>
    const phoneForm = document.getElementById('phoneForm');
    const otpForm = document.getElementById('otpForm');
    const authAlert = document.getElementById('authAlert');
    let currentPhone = '';

    function showAlert(msg, isErr = true) {
      authAlert.classList.remove('hidden');
      authAlert.textContent = msg;
      authAlert.className = `mb-4 p-3 rounded-lg text-sm border ${isErr ? 'bg-rose-950/50 border-rose-800/60 text-rose-300' : 'bg-emerald-950/50 border-emerald-800/60 text-emerald-300'}`;
    }

    // Step 1: Send SMS OTP
    phoneForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      currentPhone = document.getElementById('phoneInput').value.trim();
      const btn = document.getElementById('phoneBtn');
      btn.disabled = true;
      btn.textContent = 'Sending SMS...';

      try {
        const res = await fetch('/api/auth/send-otp', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ phone: currentPhone })
        });
        const data = await res.json();
        if (data.success) {
          phoneForm.classList.add('hidden');
          otpForm.classList.remove('hidden');
          document.getElementById('phoneDisplay').textContent = data.phoneMasked || currentPhone;
          document.getElementById('authTitle').textContent = 'Enter SMS OTP';
          document.getElementById('authSubtitle').textContent = 'Enter the 6-digit code received on your phone';
          showAlert('SMS OTP sent successfully to +91 6395991106', false);
        } else {
          showAlert(data.message || 'Unauthorized Phone Number');
        }
      } catch (err) {
        showAlert('Connection error. Please check backend server.');
      } finally {
        btn.disabled = false;
        btn.textContent = 'Send SMS OTP';
      }
    });

    // Step 2: Verify OTP
    otpForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const otp = document.getElementById('otpInput').value.trim();
      const btn = document.getElementById('otpBtn');
      btn.disabled = true;
      btn.textContent = 'Verifying...';

      try {
        const res = await fetch('/api/auth/verify-otp', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ phone: currentPhone, otp })
        });
        const data = await res.json();
        if (data.success) {
          document.getElementById('authContainer').classList.add('hidden');
          document.getElementById('mainDashboard').classList.remove('hidden');
        } else {
          showAlert(data.message || 'Invalid OTP');
        }
      } catch (err) {
        showAlert('Verification failed. Try again.');
      } finally {
        btn.disabled = false;
        btn.textContent = 'Verify OTP & Open Launcher';
      }
    });

    document.getElementById('backBtn').addEventListener('click', () => {
      otpForm.classList.add('hidden');
      phoneForm.classList.remove('hidden');
      authAlert.classList.add('hidden');
      document.getElementById('authTitle').textContent = 'Secure Access';
      document.getElementById('authSubtitle').textContent = 'Enter authorized mobile number to receive OTP';
    });

    // Send Stream Execution
    document.getElementById('startBtn').addEventListener('click', async () => {
      const email = document.getElementById('smtpEmail').value;
      const appPassword = document.getElementById('smtpPass').value;
      const senderName = document.getElementById('senderName').value;
      const subject = document.getElementById('subject').value;
      const messageBody = document.getElementById('body').value;
      const rawRecipients = document.getElementById('recipients').value.split('\n').filter(r => r.trim());

      const logBox = document.getElementById('logBox');
      logBox.innerHTML = '<div class="text-indigo-400">⚡ Starting 5-Batch Stream...</div>';

      const res = await fetch('/api/send-stream', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, appPassword, senderName, subject, messageBody, recipients: rawRecipients })
      });

      const reader = res.body.getReader();
      const decoder = new TextDecoder();

      while (true) {
        const { value, done } = await reader.read();
        if (done) break;
        const chunk = decoder.decode(value);
        const lines = chunk.split('\n');
        for (const line of lines) {
          if (line.startsWith('data: ')) {
            const dataStr = line.replace('data: ', '').trim();
            if (dataStr === '[DONE]') {
              logBox.innerHTML += '<div class="text-emerald-400">✔ All emails dispatched successfully.</div>';
            } else {
              try {
                const item = JSON.parse(dataStr);
                logBox.innerHTML += `<div class="${item.success ? 'text-emerald-400' : 'text-rose-400'}">↳ ${item.recipient} : ${item.success ? 'Delivered to Inbox' : item.error}</div>`;
                logBox.scrollTop = logBox.scrollHeight;
              } catch(e) {}
            }
          }
        }
      }
    });

    document.getElementById('stopBtn').addEventListener('click', async () => {
      await fetch('/api/stop', { method: 'POST' });
    });
  </script>
</body>
</html>
